# Voltaway — stack completo in Docker Compose (locale).
#
# Avvio:
#   cp .env.example .env
#   docker compose up -d --build
#
# URL principali:
#   http://app.voltaway.localhost   — web app
#   http://api.voltaway.localhost   — API REST + WebSocket /sessions
#   http://auth.voltaway.localhost  — Keycloak
#   http://mail.voltaway.localhost  — Mailpit
#   http://minio.voltaway.localhost — MinIO console

name: voltaway

x-app-environment: &app-environment
  NODE_ENV: development
  DATABASE_URL: postgres://${POSTGRES_USER:-voltaway}:${POSTGRES_PASSWORD:-voltaway}@postgres:5432/${POSTGRES_DB:-voltaway}
  REDIS_URL: redis://redis:6379
  OIDC_ISSUER_URL: http://keycloak:8080/realms/voltaway
  OCPI_MODE: ${OCPI_MODE:-sim}
  OCPI_BASE_URL: ${OCPI_BASE_URL:-http://ocpi-sim:4000}
  OCPI_TOKEN: ${OCPI_TOKEN:-sim-token}
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-voltaway}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-voltaway}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-voltaway-secret}
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

services:
  traefik:
    image: traefik:v3.1
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=voltaway
      - --entrypoints.web.address=:80
    ports:
      - '80:80'
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [voltaway]

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voltaway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltaway}
      POSTGRES_DB: ${POSTGRES_DB:-voltaway}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-voltaway} -d ${POSTGRES_DB:-voltaway}']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [voltaway]

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [voltaway]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
      - kcdata:/opt/keycloak/data
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`auth.voltaway.localhost`)
      - traefik.http.services.auth.loadbalancer.server.port=8080
    networks: [voltaway]

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-voltaway}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-voltaway-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 6
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio.rule=Host(`minio.voltaway.localhost`)
      - traefik.http.services.minio.loadbalancer.server.port=9001
    networks: [voltaway]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-voltaway} ${MINIO_ROOT_PASSWORD:-voltaway-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-voltaway} &&
      echo 'bucket ready'
      "
    networks: [voltaway]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'
    labels:
      - traefik.enable=true
      - traefik.http.routers.mail.rule=Host(`mail.voltaway.localhost`)
      - traefik.http.services.mail.loadbalancer.server.port=8025
    networks: [voltaway]

  ocpi-sim:
    build:
      context: .
      dockerfile: apps/ocpi-sim/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '4000'
      OCPI_TOKEN: ${OCPI_TOKEN:-sim-token}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health']
      interval: 10s
      timeout: 5s
      retries: 6
    labels:
      - traefik.enable=true
      - traefik.docker.network=voltaway
      - traefik.http.routers.ocpi.rule=Host(`ocpi.voltaway.localhost`)
      - traefik.http.services.ocpi.loadbalancer.server.port=4000
    ports:
      - '4000:4000'
    networks: [voltaway]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-environment
      PORT: '3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ocpi-sim:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health']
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=voltaway
      - traefik.http.routers.api.rule=Host(`api.voltaway.localhost`)
      - traefik.http.services.api.loadbalancer.server.port=3001
    ports:
      - '3001:3001'
    networks: [voltaway]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *app-environment
      API_INTERNAL_URL: http://api:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      ocpi-sim:
        condition: service_healthy
    networks: [voltaway]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_MAP_TILES_URL: ${NEXT_PUBLIC_MAP_TILES_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_OIDC_ISSUER_URL: http://auth.voltaway.localhost/realms/voltaway
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_MAP_TILES_URL: ${NEXT_PUBLIC_MAP_TILES_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=voltaway
      - traefik.http.routers.web.rule=Host(`app.voltaway.localhost`)
      - traefik.http.services.web.loadbalancer.server.port=3000
    ports:
      - '3000:3000'
    networks: [voltaway]

networks:
  voltaway:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  kcdata:
