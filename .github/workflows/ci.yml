# =============================================================================
# Voltaway — pipeline CI (GitHub Actions)
# =============================================================================
#
# Scopo:
#   Validare ogni push e pull request su main, develop e branch feature/** prima
#   del merge: dipendenze bloccate, formattazione, build monorepo e test unitari.
#
# Componenti:
#   Job "build-and-test" (ubuntu-latest):
#     checkout → pnpm 10.12.1 → Node 22 → install → format:check → build → test
#
# Flusso dev:
#   1. Push o PR su main / develop / feature/** → workflow automatico
#   2. pnpm install --frozen-lockfile (lockfile deve essere aggiornato in repo)
#   3. pnpm format:check, pnpm build, pnpm test — fallimento blocca il merge
#   4. In locale: stessi comandi prima di aprire una PR per evitare sorprese in CI
#
name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
